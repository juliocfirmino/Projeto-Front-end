<html>
    <head>
        <title>Formulário</title>
        <link rel="stylesheet" href="form_brasileirao.css">
        <link href="projeto_front_end.html" rel="import">
    </head>
    <body>
        <form action="projeto_front_end.html" method="post">
            <div class="estrutura_de_borda">
                <label for="nome">Nome:</label>
                    <input type="text" name="nome" required class="estrutura_de_input" placeholder="Digite seu nome"><br>
                <label for="email">Email:</label>
                    <input type="email" name="email" required class="estrutura_de_input" placeholder="Digite seu email"><br>
                <label for="numero">Número:</label>
                    <input type="tel" name="numero" required class="estrutura_de_input" placeholder="Digite seu número"><br>
                <label for="idade">Idade:</label>
                    <input type="date" name="idade" required class="estrutura_de_input"><br>

                <input type="submit" value="Enviar" class="botao_enviar">
                <input type="reset" value="Apagar" class="botao_apagar">
            </div>
        </form>
    </body>
</html>
